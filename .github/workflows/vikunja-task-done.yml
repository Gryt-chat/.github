name: Close Vikunja task

# Reusable workflow. Callers pass nothing and inherit the org secret:
#
#   jobs:
#     close-task:
#       uses: Gryt-chat/.github/.github/workflows/vikunja-task-done.yml@main
#       secrets: inherit
#
# Marks the Vikunja task matching the branch name as done when a PR merges.
# Branch names carry the identifier, e.g. claude/GRYT-1-blog-og-images -> GRYT-1.

on:
  workflow_call:
    inputs:
      vikunja_url:
        description: Vikunja API base URL
        required: false
        type: string
        default: https://tasks.sivert.io/api/v1
      project_id:
        description: Vikunja project holding the tasks
        required: false
        type: number
        default: 2
    secrets:
      VIKUNJA_API_TOKEN:
        required: true

jobs:
  close-task:
    # Only on a real merge — a closed-without-merging PR must not close the task.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Mark task done
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          VIKUNJA_URL: ${{ inputs.vikunja_url }}
          PROJECT_ID: ${{ inputs.project_id }}
          TOKEN: ${{ secrets.VIKUNJA_API_TOKEN }}
        run: |
          set -euo pipefail

          # Pull GRYT-<n> out of the branch name. No match is normal (docs typo
          # branches, dependabot, contributor branches) — succeed quietly.
          ID=$(printf '%s' "$BRANCH" | grep -oiE '[A-Z]+-[0-9]+' | head -1 | tr '[:lower:]' '[:upper:]' || true)
          if [ -z "$ID" ]; then
            echo "No task identifier in branch '$BRANCH' — nothing to close."
            exit 0
          fi
          echo "Branch '$BRANCH' -> task $ID"

          api() {
            curl -sS --fail-with-body --max-time 30 \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -H "User-Agent: gryt-ci" "$@"
          }

          # Resolve the human identifier to Vikunja's numeric task id.
          TASKS=$(api "$VIKUNJA_URL/projects/$PROJECT_ID/tasks?per_page=200")
          NUM=$(printf '%s' "$TASKS" | jq -r --arg id "$ID" '.[] | select(.identifier == $id) | .id' | head -1)
          if [ -z "$NUM" ] || [ "$NUM" = "null" ]; then
            echo "::warning::No Vikunja task matches $ID — leaving it alone."
            exit 0
          fi

          api -X POST "$VIKUNJA_URL/tasks/$NUM" \
            -d "$(jq -nc --argjson id "$NUM" '{id: $id, done: true}')" > /dev/null

          # Labels are NOT settable through the task update — Vikunja silently
          # ignores a `labels` field there. They have their own endpoint, so the
          # workflow labels have to be removed one by one.
          printf '%s' "$TASKS" | jq -r --arg id "$ID" \
            '.[] | select(.identifier == $id) | .labels // [] | .[]
              | select(.title == "in progress" or .title == "in review") | .id' \
          | while read -r LABEL; do
              [ -n "$LABEL" ] || continue
              api -X DELETE "$VIKUNJA_URL/tasks/$NUM/labels/$LABEL" > /dev/null \
                || echo "::warning::Could not remove label $LABEL."
            done

          api -X PUT "$VIKUNJA_URL/tasks/$NUM/comments" \
            -d "$(jq -nc --arg url "$PR_URL" '{comment: ("Merged in " + $url + " — closing.")}')" > /dev/null \
            || echo "::warning::Task closed, but the comment failed."

          echo "Closed $ID (task $NUM)."
