name: Sync Vikunja task

# Reusable workflow. Callers invoke it with `secrets: inherit`:
#
#   on:
#     pull_request:
#       types: [opened, reopened, closed]
#   jobs:
#     sync-task:
#       uses: Gryt-chat/.github/.github/workflows/vikunja-task-done.yml@main
#       secrets: inherit
#
# Keeps the Vikunja task named in the branch in step with the PR:
#   PR opened          -> label "in review", comment the PR link on the task
#   PR merged          -> mark done, drop the workflow labels
#   PR closed unmerged -> left alone, since that state is ambiguous
#
# Branch names carry the identifier, e.g. claude/GRYT-1-blog-og-images -> GRYT-1.

on:
  workflow_call:
    inputs:
      vikunja_url:
        description: Vikunja API base URL
        required: false
        type: string
        default: https://tasks.sivert.io/api/v1
      project_id:
        description: Vikunja project holding the tasks
        required: false
        type: number
        default: 2
    secrets:
      VIKUNJA_API_TOKEN:
        required: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync task with PR state
        env:
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          VIKUNJA_URL: ${{ inputs.vikunja_url }}
          PROJECT_ID: ${{ inputs.project_id }}
          TOKEN: ${{ secrets.VIKUNJA_API_TOKEN }}
        run: |
          set -euo pipefail

          # Pull GRYT-<n> out of the branch name. No match is normal (dependabot,
          # contributor branches, quick fixes) — succeed quietly.
          ID=$(printf '%s' "$BRANCH" | grep -oiE '[A-Z]+-[0-9]+' | head -1 | tr '[:lower:]' '[:upper:]' || true)
          if [ -z "$ID" ]; then
            echo "No task identifier in branch '$BRANCH' — nothing to sync."
            exit 0
          fi

          api() {
            curl -sS --fail-with-body --max-time 30 \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -H "User-Agent: gryt-ci" "$@"
          }

          TASKS=$(api "$VIKUNJA_URL/projects/$PROJECT_ID/tasks?per_page=200")
          NUM=$(printf '%s' "$TASKS" | jq -r --arg id "$ID" '.[] | select(.identifier == $id) | .id' | head -1)
          if [ -z "$NUM" ] || [ "$NUM" = "null" ]; then
            echo "::warning::No Vikunja task matches $ID — leaving it alone."
            exit 0
          fi
          echo "Branch '$BRANCH' -> $ID (task $NUM)"

          # Resolve label ids by title so they are not hardcoded here.
          LABELS=$(api "$VIKUNJA_URL/labels")
          label_id() { printf '%s' "$LABELS" | jq -r --arg t "$1" '.[] | select(.title == $t) | .id' | head -1; }
          IN_PROGRESS=$(label_id "in progress")
          IN_REVIEW=$(label_id "in review")

          add_label() {
            [ -n "${2:-}" ] && [ "$2" != "null" ] || return 0
            api -X PUT "$VIKUNJA_URL/tasks/$1/labels" -d "$(jq -nc --argjson l "$2" '{label_id:$l}')" >/dev/null 2>&1 \
              || echo "::warning::Could not add label $2."
          }
          remove_label() {
            [ -n "${2:-}" ] && [ "$2" != "null" ] || return 0
            api -X DELETE "$VIKUNJA_URL/tasks/$1/labels/$2" >/dev/null 2>&1 || true
          }
          comment() {
            api -X PUT "$VIKUNJA_URL/tasks/$1/comments" -d "$(jq -nc --arg c "$2" '{comment:$c}')" >/dev/null \
              || echo "::warning::Comment failed."
          }

          if [ "$ACTION" = "closed" ]; then
            if [ "$MERGED" != "true" ]; then
              echo "PR closed without merging — leaving $ID alone."
              exit 0
            fi
            # Vikunja ignores a `labels` field in the task update, so `done` is set
            # here and the labels are removed through their own endpoint.
            api -X POST "$VIKUNJA_URL/tasks/$NUM" -d "$(jq -nc --argjson id "$NUM" '{id:$id,done:true}')" >/dev/null
            remove_label "$NUM" "$IN_PROGRESS"
            remove_label "$NUM" "$IN_REVIEW"
            comment "$NUM" "Merged in $PR_URL — closing."
            echo "Closed $ID."
          else
            add_label "$NUM" "$IN_REVIEW"
            remove_label "$NUM" "$IN_PROGRESS"
            # Only comment when the PR first appears, so reopening does not spam.
            if [ "$ACTION" = "opened" ]; then
              comment "$NUM" "PR opened: $PR_URL — $PR_TITLE"
            fi
            echo "Marked $ID in review."
          fi
