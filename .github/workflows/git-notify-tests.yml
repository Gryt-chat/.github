name: Notification action tests

on:
  pull_request:
    paths:
      - actions/git-notify/**
      - actions/release-notify/**
      - actions/notify/**
      - .github/workflows/git-notify-tests.yml
      - .github/workflows/discord-ci-notify.yml
  push:
    branches: [main]
    paths:
      - actions/git-notify/**
      - actions/release-notify/**
      - actions/notify/**
      - .github/workflows/git-notify-tests.yml
      - .github/workflows/discord-ci-notify.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Git activity cards
        run: bash actions/git-notify/test.sh
      - name: Test release cards
        run: bash actions/release-notify/test.sh
