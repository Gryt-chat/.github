name: Discord CI notification

# Reusable workflow. Callers invoke it from a workflow_run trigger with
# `secrets: inherit`:
#
#   on:
#     workflow_run:
#       workflows: [Sync Vikunja task]
#       types: [completed]
#   jobs:
#     notify:
#       uses: Gryt-chat/.github/.github/workflows/discord-ci-notify.yml@main
#       secrets: inherit
#
# Posts to #ci when a workflow fails, and once more when it goes green again.
# Successes are otherwise silent. The channel is only worth leaving unmuted if
# it stays quiet, so anything that isn't a failure or a recovery says nothing.
#
# Callers must list the workflows they watch by name. GitHub's docs don't say
# whether `workflows` can be omitted to mean "all of them", so we don't rely on
# it — an unlisted workflow silently never notifies, which is the worst way for
# this to break. Add new workflows to the caller's list as you add them.
#
# #ci exists on Discord and on the Gryt community server, and each gets the same
# message. The org secrets are DISCORD_CI_WEBHOOK_URL and GRYT_CI_WEBHOOK_URL,
# and a repository that can't see one of them skips that one.

on:
  workflow_call:
    inputs:
      channel_name:
        description: Channel named in the embed footer, for orientation
        required: false
        type: string
        default: "#ci"
    secrets:
      DISCORD_CI_WEBHOOK_URL:
        required: false
      GRYT_CI_WEBHOOK_URL:
        required: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether this run is worth a message
        id: message
        env:
          HAS_DISCORD: ${{ secrets.DISCORD_CI_WEBHOOK_URL != '' }}
          HAS_GRYT: ${{ secrets.GRYT_CI_WEBHOOK_URL != '' }}
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel_name }}
          REPO: ${{ github.event.repository.full_name }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          WF_ID: ${{ github.event.workflow_run.workflow_id }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          TRIGGER: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail

          if [ "$HAS_DISCORD" != "true" ] && [ "$HAS_GRYT" != "true" ]; then
            echo "Neither DISCORD_CI_WEBHOOK_URL nor GRYT_CI_WEBHOOK_URL is set — skipping"
            exit 0
          fi

          # cancelled/skipped/neutral are usually deliberate, so they say nothing.
          case "$CONCLUSION" in
            failure|timed_out) STATE="failed" ;;
            success)           STATE="maybe-recovered" ;;
            *)                 echo "Conclusion '$CONCLUSION' is not worth a message."; exit 0 ;;
          esac

          # A green run only earns a message if it follows a red one, so the
          # channel reports transitions rather than status. Look at the previous
          # completed run of the same workflow on the same branch.
          if [ "$STATE" = "maybe-recovered" ]; then
            PREV=$(gh api \
              "repos/$REPO/actions/workflows/$WF_ID/runs?branch=$BRANCH&status=completed&per_page=10" \
              --jq "[.workflow_runs[] | select(.id < $RUN_ID)] | first | .conclusion" 2>/dev/null || echo "")

            case "$PREV" in
              failure|timed_out)
                STATE="recovered"
                ;;
              *)
                echo "Previous run on '$BRANCH' was '${PREV:-none}' — no recovery to report."
                exit 0
                ;;
            esac
          fi

          DETAILS=""
          if [ "$STATE" = "failed" ]; then
            TITLE="❌ $WF_NAME failed"
            COLOR=15548997
            GRYT_COLOR="#e5484d"

            FAILED_JOBS=$(gh api \
              "repos/$REPO/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" \
              --jq '[.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | "- " + .name][:5] | join("\n")' \
              2>/dev/null || echo "")
            if [[ -n "$FAILED_JOBS" ]]; then
              DETAILS="**Failed jobs**"
      # The action never fails the job, so a broken alert path doesn't show up as a second red run.
      - name: Post it to Discord and Gryt
        if: steps.message.outputs.payload != ''
        uses: Gryt-chat/.github/actions/notify@main
        with:
          payload: ${{ steps.message.outputs.payload }}
          gryt-payload: ${{ steps.message.outputs.gryt_payload }}
          discord-webhook-url: ${{ secrets.DISCORD_CI_WEBHOOK_URL }}
          gryt-webhook-url: ${{ secrets.GRYT_CI_WEBHOOK_URL }}
\n'"$FAILED_JOBS"
            fi
          else
            TITLE="✅ $WF_NAME is green again"
            COLOR=5763719
            GRYT_COLOR="#3fb27f"
            DETAILS="The workflow recovered after the previous failed run."
          fi

          SHORT_SHA="$(printf '%s' "${SHA:-}" | cut -c1-7)"
          ACTOR_VALUE="${ACTOR:-unknown}"
          if [[ -n "${ACTOR:-}" ]]; then
            ACTOR_VALUE="[@$ACTOR](https://github.com/$ACTOR)"
          fi

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg url "$RUN_URL" \
            --arg description "$DETAILS" \
            --arg repo "$REPO" \
            --arg branch "${BRANCH:-unknown}" \
            --arg sha "$SHORT_SHA" \
            --arg actor "${ACTOR:-unknown}" \
            --arg trigger "${TRIGGER:-unknown}" \
            --arg run "#$RUN_NUMBER" \
            --arg channel "$CHANNEL" \
            --argjson color "$COLOR" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: (if $description == "" then null else $description end),
                color: $color,
                fields: [
                  { name: "Repository", value: $repo,    inline: true },
                  { name: "Branch",     value: $branch,  inline: true },
                  { name: "Run",        value: $run,     inline: true },
                  { name: "Commit",     value: $sha,     inline: true },
                  { name: "Triggered by", value: $actor, inline: true },
                  { name: "Event",      value: $trigger, inline: true }
                ],
                footer: { text: "Gryt CI" },
                timestamp: (now | todate)
              } | with_entries(select(.value != null))]
            }')

          GRYT_PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg url "$RUN_URL" \
            --arg description "$DETAILS" \
            --arg repo "$REPO" \
            --arg repo_url "https://github.com/$REPO" \
            --arg branch "${BRANCH:-unknown}" \
            --arg sha "$SHORT_SHA" \
            --arg actor "$ACTOR_VALUE" \
            --arg trigger "${TRIGGER:-unknown}" \
            --arg run "#$RUN_NUMBER" \
            --arg channel "$CHANNEL" \
            --arg color "$GRYT_COLOR" \
            '{
              display_name: "Gryt CI",
              cards: [{
                author: {name: $repo, url: $repo_url},
                title: $title,
                url: $url,
                description: (if $description == "" then null else $description end),
                color: $color,
                fields: [
                  { name: "Branch", value: $branch, inline: true },
                  { name: "Run", value: $run, inline: true },
                  { name: "Commit", value: $sha, inline: true },
                  { name: "Actor", value: $actor, inline: true },
                  { name: "Event", value: $trigger, inline: true }
                ],
                footer: { text: ("Gryt CI · " + $channel) },
                timestamp: (now | todate)
              } | with_entries(select(.value != null))]
            }')

          echo "payload=$(printf '%s' "$PAYLOAD" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "gryt_payload=$(printf '%s' "$GRYT_PAYLOAD" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "Reporting '$STATE' for $WF_NAME on $BRANCH."

      # The action never fails the job, so a broken alert path doesn't show up as a second red run.
      - name: Post it to Discord and Gryt
        if: steps.message.outputs.payload != ''
        uses: Gryt-chat/.github/actions/notify@main
        with:
          payload: ${{ steps.message.outputs.payload }}
          discord-webhook-url: ${{ secrets.DISCORD_CI_WEBHOOK_URL }}
          gryt-webhook-url: ${{ secrets.GRYT_CI_WEBHOOK_URL }}
