name: CLA

# This repo's own caller, by path, so a change to cla.yml checks itself on the way in.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

permissions:
  pull-requests: read
  actions: write

jobs:
  cla:
    uses: ./.github/workflows/cla.yml
