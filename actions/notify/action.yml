name: Post a notification to Discord and Gryt
description: >-
  Posts a Discord webhook payload to Discord and a native Gryt webhook payload
  to Gryt. When no native Gryt payload is supplied, the Discord payload is
  translated to Gryt cards for backwards compatibility.

inputs:
  payload:
    description: Discord webhook payload, as JSON
    required: false
    default: "{}"
  gryt-payload:
    description: Native Gryt webhook payload. Empty translates payload instead.
    required: false
    default: ""
  discord-webhook-url:
    description: Where Discord gets it. Empty skips Discord
    required: false
    default: ""
  gryt-webhook-url:
    description: Where Gryt gets it. Empty skips Gryt
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Post to Discord and Gryt
      shell: bash
      env:
        NOTIFY_PAYLOAD: ${{ inputs.payload }}
        NOTIFY_GRYT_PAYLOAD: ${{ inputs.gryt-payload }}
        NOTIFY_DISCORD_URL: ${{ inputs.discord-webhook-url }}
        NOTIFY_GRYT_URL: ${{ inputs.gryt-webhook-url }}
      run: bash "$GITHUB_ACTION_PATH/notify.sh"
